<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <style>
    .cls-1 { fill: #26667a; }
    .cls-2 { fill: #3c8d5a; }
    .cls-3 { fill: #a5532b; }
    .label { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: bold; text-anchor: middle; }
  </style>
  <g id="maps">
    <circle class="cls-1" cx="110" cy="110" r="90" />
    <text class="label" x="110" y="104">Explorer</text>
    <text class="label" x="110" y="128">les cartes</text>
  </g>
  <g id="resources">
    <circle class="cls-2" cx="300" cy="110" r="90" />
    <text class="label" x="300" y="104">Autres</text>
    <text class="label" x="300" y="128">ressources</text>
  </g>
  <g id="open-data">
    <circle class="cls-3" cx="490" cy="110" r="90" />
    <text class="label" x="490" y="104">Cartes</text>
    <text class="label" x="490" y="128">ouvertes</text>
  </g>
</svg>
