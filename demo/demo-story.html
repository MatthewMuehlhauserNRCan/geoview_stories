<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GeoView Story</title>
  
  <!-- Step 1: Include GeoView (required for map panels) -->
  <script src="https://canadian-geospatial-platform.github.io/geoview/public/cgpv-main.js"></script>
  
  <style>
    /* Remove default margins for full-screen story */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body>
  <!-- Step 2: Add a story container with data-config attribute -->
  <!-- The library will automatically initialize any element with class="geoview-story" -->
  <div 
    class="geoview-story" 
    data-config="configs/demo-story.json"
  ></div>

  <!-- Step 3: Include GeoView Story Library -->
  <!-- Option A: From GitHub Pages CDN (recommended) -->
  <script src="https://matthewmuehlhausernrcan.github.io/geoview_stories/geoview-story.js"></script>
  
  <!-- Option B: From local build (for development) -->
  <!-- <script src="../geoview-story.js"></script> -->
</body>
</html>
